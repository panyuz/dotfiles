# herdr config — Ghostty + OMP on macOS（2026-08-21 优化）
# ~/.config/herdr/config.toml

onboarding = false

# ── Theme：Rose Pine 软暗色护眼（与 ghostty 同步，固定暗色不随系统切亮）──
[theme]
name        = "rose-pine"
auto_switch = false

# ── Terminal ───────────────────────────────────────────
[terminal]
default_shell = "zsh"
shell_mode    = "auto"       # login shell on macOS
new_cwd       = "follow"     # inherit from source pane
# 🔴 2026-09-11 图片显示排查：herdr 0.9.0 起本项正式位置为 [terminal]，
#   且「Pane images and the graphics API are now enabled by default in compatible terminals」
#   旧位置 [experimental].kitty_graphics 仍被接受，但已非正式路径 → 迁到此处。
# ⚠️ herdr 二进制原文： "kitty_graphics changes require restarting Herdr; kept current setting"
#   → `herdr server reload-config` 对本项无效，**必须完整重启**（herdr server stop 后重开）。
# ✅ 实测结论（2026-09-11）：herdr 0.9.0 的 kitty 图形通道 **单条与分块（m=1/m=0 续传）均正常**
#   （用 pi 的 encodeKitty 格式复刻 4 组测试，全数渲染成功）→ herdr 侧无缺陷。
#   pi issue #7585（图片区域空白）属 herdr ≤0.8.0 旧版问题，与本机 0.9.0 无关，仅作历史参考。
kitty_graphics = true

# ── Keys — prefix-first, tmux-alike ────────────────────
[keys]
prefix = "ctrl+a"              # tmux muscle memory

# 直连键（无 prefix）采用 herdr 官方推荐的 ctrl+alt 家族：不被系统/终端/应用占用
# Workspace / tab
new_workspace       = "prefix+shift+n"
workspace_picker    = "prefix+w"
close_workspace     = "prefix+shift+d"
new_tab             = ["prefix+c", "ctrl+alt+c"]
close_tab           = "prefix+shift+x"
rename_tab          = "prefix+shift+t"
next_tab            = ["prefix+n", "ctrl+alt+]"]
previous_tab        = ["prefix+p", "ctrl+alt+["]
switch_tab          = "prefix+1..9"
switch_workspace    = "prefix+shift+1..9"

# Pane
split_vertical      = ["prefix+v", "ctrl+alt+d"]
split_horizontal    = ["prefix+minus", "ctrl+alt+shift+d"]
close_pane          = "prefix+x"
zoom                = ["prefix+z", "ctrl+alt+z"]
focus_pane_left     = ["prefix+h", "ctrl+alt+h"]
focus_pane_down     = ["prefix+j", "ctrl+alt+j"]
focus_pane_up       = ["prefix+k", "ctrl+alt+k"]
focus_pane_right    = ["prefix+l", "ctrl+alt+l"]
cycle_pane_next     = "prefix+tab"
last_pane           = "prefix+o"
resize_mode         = "prefix+r"
# 默认 open_notification_target 占 prefix+o，已让位给 last_pane（空串=禁用）
open_notification_target = ""

# Agent focus（option-as-alt 开启后 alt 组合键才能送达）
focus_agent         = "prefix+alt+1..9"
next_agent          = "prefix+alt+]"
previous_agent      = "prefix+alt+["   # prefix+[ 恢复为 herdr 复制模式（原默认）

# Navigate mode (vim-like)
navigate_pane_left  = "h"
navigate_pane_down  = "j"
navigate_pane_up    = "k"
navigate_pane_right = "l"

# Meta
help                = "prefix+?"
settings            = "prefix+s"
detach              = "prefix+q"
reload_config       = "prefix+shift+r"
toggle_sidebar      = "prefix+b"
edit_scrollback     = "prefix+e"
goto                = "prefix+g"

# ── Custom popup ───────────────────────────────────────
[[keys.command]]
key         = "prefix+alt+g"
type        = "popup"
command     = "lazygit"
description = "lazygit"
width       = "90%"
height      = "90%"

# ── OMP Agent jump ─────────────────────────────────────
# type=pane 新 pane 继承源 pane cwd（new_cwd=follow），直接 omp 即可；
# 旧写法 ${HERDR_PANE_CWD:-$HOME} 变量不存在，会恒回退 $HOME
[[keys.command]]
key         = "prefix+ctrl+s"
type        = "pane"
command     = "omp"
description = "New OMP pane"

# ── UI ─────────────────────────────────────────────────
[ui]
sidebar_start_collapsed = false
sidebar_collapsed_mode  = "compact"
pane_borders            = true
pane_gaps               = true
mouse_capture           = true
copy_on_select          = true
confirm_close           = true
prompt_new_tab_name     = false      # 新 tab 立即创建，改名用 prefix+shift+t
hide_tab_bar_when_single_tab = true
tab_bar_right           = [{ type = "zoom" }, { type = "datetime" }]

# Agent sidebar: compact display
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true
[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "state_text", "workspace", "tab"],
  ["agent"],
]

# Per-agent custom rows
[ui.sidebar.agents.rows_by_agent]
omp = [
  ["state_icon", "state_text", "workspace"],
  ["terminal_title_stripped"],
  ["agent"],
]

# Workspace sidebar
[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "state_text", "workspace"],
  ["branch", "git_status"],
]

# ── Notifications ──────────────────────────────────────
[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "bottom-right"

[ui.toast.clipboard]
enabled  = true
position = "bottom-center"

# ── Sound ──────────────────────────────────────────────
[ui.sound]
enabled = true

# ── Session ────────────────────────────────────────────
[session]
resume_agents_on_restore = true

# ── Remote ─────────────────────────────────────────────
[remote]
manage_ssh_config = true

# ── macOS CJK IME fixes ────────────────────────────────
[experimental]
# 2026-09-11 排查记录（已回滚）：曾因误判「Cmd+V 粘贴失效」而将下列两项置 false，
#   后定位真因 = **Ghostty 的 Cmd+V 路径不处理纯图片剪贴板数据**（上游 discussion #10478），
#   与 IME 无关 → 已改回原值。
#   📌 图片粘贴要点：pi 的图片粘贴键位是 **Ctrl+V**（app.clipboard.pasteImage），
#   **Cmd+V 对纯图片剪贴板完全无效**（Ghostty 只处理文件URL/文本，无内容可发 → 什么都送不到 pi）。
#   pi 行为：Ctrl+V 先读剪贴板图片→存 $TMPDIR/pi-clipboard-<uuid>.png→**只插入路径文本，不渲染预览**。
switch_ascii_input_source_in_prefix = true
reveal_hidden_cursor_for_cjk_ime   = true
cjk_ime_agents = ["pi", "claude"]
# kitty_graphics 已迁往 [terminal]（0.9.0 正式位置，见上）；pane_history 仍留本段。
pane_history   = true   # 跨 herdr 重启保留 pane 屏幕历史（配合 resume_agents_on_restore）

# ── Advanced ───────────────────────────────────────────
[advanced]
# 每 pane 滚动缓冲上限（默认 10MB → 50MB，容纳长 agent 输出）
scrollback_limit_bytes = 50000000

# ── Updates ────────────────────────────────────────────
[update]
channel       = "stable"
version_check = true
manifest_check = true
